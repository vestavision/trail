name: Bug report
description: Report reproducible incorrect behavior in Trail
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove credentials, payloads, and production data before submitting.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible example.
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Trail version or commit}
    validations: {required: true}
  - type: input
    id: environment
    attributes: {label: Go version and operating system}
    validations: {required: true}
