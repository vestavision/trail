name: trail
services:
  nats:
    image: nats:2.11-alpine
    command: ["-js","-sd","/data","-m","8222"]
    ports: ["4222:4222","8222:8222"]
    volumes: ["nats-data:/data"]
    healthcheck: {test: ["CMD","wget","-q","-O","-","http://localhost:8222/healthz"], interval: 3s, timeout: 2s, retries: 20}
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    ports: ["8123:8123","9000:9000"]
    environment: {CLICKHOUSE_DB: trail, CLICKHOUSE_USER: trail, CLICKHOUSE_PASSWORD: trail, CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"}
    volumes: ["clickhouse-data:/var/lib/clickhouse"]
    healthcheck: {test: ["CMD-SHELL","wget -q -O - 'http://localhost:8123/ping'"], interval: 3s, timeout: 2s, retries: 30}
  minio:
    # Last published community container; local proving use only.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: trail, MINIO_ROOT_PASSWORD: trail-secret}
    ports: ["9001:9001","9010:9000"]
    volumes: ["minio-data:/data"]
  ingestor:
    build: {context: ., args: {COMMAND: trail-ingestor}}
    environment: {TRAIL_STORE: clickhouse, TRAIL_CLICKHOUSE_ADDR: clickhouse:9000, TRAIL_CLICKHOUSE_DATABASE: trail, TRAIL_CLICKHOUSE_USERNAME: trail, TRAIL_CLICKHOUSE_PASSWORD: trail, TRAIL_NATS_URL: nats://nats:4222, TRAIL_MANAGE_STREAM: "true"}
    depends_on: {nats: {condition: service_healthy}, clickhouse: {condition: service_healthy}}
  explorer-api:
    build: {context: ., args: {COMMAND: trail-explorer-api}}
    environment: {TRAIL_STORE: clickhouse, TRAIL_CLICKHOUSE_ADDR: clickhouse:9000, TRAIL_CLICKHOUSE_DATABASE: trail, TRAIL_CLICKHOUSE_USERNAME: trail, TRAIL_CLICKHOUSE_PASSWORD: trail, TRAIL_PAYLOAD_S3_ENDPOINT: minio:9000, TRAIL_PAYLOAD_S3_ACCESS_KEY: trail, TRAIL_PAYLOAD_S3_SECRET_KEY: trail-secret, TRAIL_PAYLOAD_S3_BUCKET: trail-payloads, TRAIL_PAYLOAD_S3_ENSURE_BUCKET: "true"}
    depends_on: {clickhouse: {condition: service_healthy}, minio: {condition: service_started}}
  explorer:
    build: ../trail-explorer
    ports: ["3000:80"]
    depends_on: [explorer-api]
  postgres:
    profiles: ["postgres"]
    image: postgres:17-alpine
    environment: {POSTGRES_DB: trail, POSTGRES_USER: trail, POSTGRES_PASSWORD: trail}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U trail"], interval: 3s, timeout: 2s, retries: 20}
volumes: {nats-data: {}, clickhouse-data: {}, minio-data: {}, postgres-data: {}}
